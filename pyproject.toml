[project]
name = "rimproject"
version = "0.1.0"
description = "ResNet Inventory Management system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=3.2,<3.3",
    "djangorestframework>=3.15.1",
]

[dependency-groups]
production = [
    "django-auth-sgf",
    "psycopg2>=2.9.10",
    "uwsgi>=2.0.28",
]

[tool.uv.sources]
django-auth-sgf = { git = "file:///mnt/repo/django-auth-sgf" }
